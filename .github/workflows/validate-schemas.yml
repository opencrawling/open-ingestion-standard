name: Validate OIS Schemas

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install jsonschema pyyaml

      - name: Run schema validations
        run: |
          python -c "
          import glob, json, yaml, jsonschema
          
          doc_schema = json.load(open('schemas/document.schema.json'))
          for doc_path in sorted(glob.glob('examples/sample-document*.json')):
              doc_data = json.load(open(doc_path))
              jsonschema.validate(doc_data, doc_schema)
              print(f'Validated document payload: {doc_path}')
          
          job_schema = json.load(open('schemas/job.schema.json'))
          for job_path in sorted(glob.glob('examples/sample-job*.json')):
              job_data = json.load(open(job_path))
              jsonschema.validate(job_data, job_schema)
              print(f'Validated JSON job payload: {job_path}')
          
          for job_yaml_path in sorted(glob.glob('examples/sample-job*.yaml')):
              job_yaml_data = yaml.safe_load(open(job_yaml_path))
              jsonschema.validate(job_yaml_data, job_schema)
              print(f'Validated YAML job payload: {job_yaml_path}')
          "
